name: Daily Eto Fortune - Batch 2 (U, Tatsu, Mi)
on:
  workflow_dispatch:
  schedule:
    # 3:00 PM JST = 06:00 UTC - 2 hours after Batch 1
    - cron: "0 6 * * *"

concurrency:
  group: daily-eto-production
  cancel-in-progress: false

jobs:
  produce-video:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        eto: ["U (Rabbit/卯)", "Tatsu (Dragon/辰)", "Mi (Snake/巳)"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Get JST date for almanac cache
        id: jst_date
        run: echo "date=$(TZ=Asia/Tokyo date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Restore Deep Almanac cache
        uses: actions/cache@v4
        with:
          path: cache/almanac
          key: deep-almanac-${{ steps.jst_date.outputs.date }}
          restore-keys: deep-almanac-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Stagger matrix job (Gemini rate limits)
        if: strategy.job-index > 0
        run: sleep $(( ${{ strategy.job-index }} * 60 ))

      - name: Run Production Studio
        env:
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_SINGLE_KEY: "1"
          GEMINI_ONLY: "0"
          REQUIRE_DEEP_ALMANAC: "1"
          GEMINI_MODEL: gemini-2.0-flash
          GEMINI_MIN_CALL_INTERVAL: "15"
          GEMINI_POST_CALL_COOLDOWN: "40"
          GEMINI_BETWEEN_STEP_COOLDOWN: "35"
          GEMINI_MAX_CALLS_PER_MINUTE: "4"
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python main.py --eto "${{ matrix.eto }}" --type shorts --upload

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-batch2-${{ strategy.job-index }}
          path: outputs/*.mp4
          retention-days: 7
